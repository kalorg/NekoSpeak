name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ fix/all-omnivoice-pocket ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Autoriser gradlew
        run: chmod +x gradlew
      - name: Compiler APK
        run: ./gradlew assembleDebug
      - name: Exporter APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpeak-APK
          path: app/build/outputs/apk/debug/*.apk
